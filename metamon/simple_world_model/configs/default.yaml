# V/M/C world-model defaults.  V sees only `team_header + current_state`; all
# observed temporal context is retained by M's causal latent transformer.
model:
  latent_dim: 512

  v:
    d_model: 512
    n_heads: 8
    n_layers: 8
    d_ff: 2048
    dropout: 0.00
    # This caps header + one state, independently of M history length.
    max_seq_len: 1024
    max_state_tokens: 512
    ffn_activation: gelu
    gradient_checkpointing: true

  # Kept under this historical key, but now configures an embedding table over
  # canonical actions rather than a token-level action Transformer.
  action_encoder:
    action_dim: 128

  m:
    d_model: 256
    n_heads: 8
    n_layers: 6
    d_ff: 1024
    dropout: 0.0
    num_mixtures: 5
    ffn_activation: gelu
    gradient_checkpointing: true

  controller:
    hidden_dim: 512
    dropout: 0.0

# Stage-specific loss weights are CLI-overridable.  V KL warms from zero to
# beta_kl; free bits are configured on the CLI because they are a schedule.
loss:
  beta_kl: 0.01
  lambda_opponent: 1.0
  lambda_mdn: 1.0
  lambda_done: 0.25
  lambda_value: 0.25
