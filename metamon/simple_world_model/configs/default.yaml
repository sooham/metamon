model:
  latent_dim: 1024

  v:
    d_model: 512
    n_heads: 8
    n_layers: 6
    d_ff: 2048
    dropout: 0.0
    theta: 10000.0
    ffn_activation: gelu
    gradient_checkpointing: true

  action_encoder:
    action_dim: 256
    d_model: 128
    n_heads: 4
    n_layers: 2
    d_ff: 512
    dropout: 0.0
    max_seq_len: 32
    ffn_activation: gelu
    gradient_checkpointing: true

  m:
    d_model: 1024
    n_heads: 8
    n_layers: 4
    d_ff: 4096
    dropout: 0.0
    num_mixtures: 5
    ffn_activation: gelu
    gradient_checkpointing: true

  controller:
    hidden_dim: 512
    dropout: 0.0

loss:
  lambda_recon: 1.0
  beta_kl: 0.01
  lambda_mdn: 1.0
  lambda_terminal: 0.25
  lambda_controller_bc: 1.0
