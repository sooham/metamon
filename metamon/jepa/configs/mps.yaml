# LeJEPA v4 — MPS-optimized config for Apple Silicon (24 GB unified memory)
#
# Reduced capacity vs default.yaml for MPS (no torch.compile, slower per-op).
#
# CLI invocation (from repo root):
#   uv run python -m metamon.jepa.train_paired \
#       --config metamon/jepa/configs/mps.yaml \
#       --data_root $METAMON_CACHE_DIR/world-model-samples \
#       --formats gen1ou \
#       --tokenizer_path $METAMON_CACHE_DIR/tokenizers/WorldModelObservationSpace-v1.json \
#       --save_dir $METAMON_CACHE_DIR/jepa-checkpoints \
#       --batch_size 32 --lr 3e-4 --epochs 100 \
#       --num_workers 0

model:
  vocab_size: null
  latent_dim: 128
  action_latent_dim: 32

  encoder:
    d_model: 256
    n_heads: 4
    n_layers: 6
    d_ff: 1024
    dropout: 0.1
    max_seq_len: 2048
    theta: 10000.0
    ffn_activation: gelu
    gradient_checkpointing: true

  temporal_encoder:
    n_heads: 4
    n_layers: 3
    d_ff: 512
    dropout: 0.1
    max_seq_len: 4096
    ffn_activation: gelu
    gradient_checkpointing: false

  action_encoder:
    d_model: 96
    n_heads: 3
    n_layers: 2
    d_ff: 384
    dropout: 0.1
    max_seq_len: 64
    theta: 10000.0
    ffn_activation: gelu
    gradient_checkpointing: false

  opponent_belief_predictor:
    hidden_dim: null
    n_layers: 2

  next_state_predictor:
    hidden_dim: null
    n_layers: 2

  decision_state_encoder:
    decision_dim: 384
    hidden_dim: null
    n_layers: 3
    dropout: 0.1

  value_head:
    hidden_dim: null
    n_layers: 2
    dropout: 0.1

  action_projector:
    hidden_dim: null
    dropout: 0.1

  action_value_head:
    hidden_dim: null
    n_layers: 2
    dropout: 0.1

  rank_head:
    hidden_dim: null
    n_layers: 2

  lambda_sigreg: 0.05
  lambda_value: 1.0
  lambda_q_value: 1.0
  lambda_policy: 1.0
  lambda_value_teacher: 0.25
  lambda_q_teacher: 0.25
  advantage_temperature: null
  advantage_weight_min: 0.1
  advantage_weight_max: 10.0
  lambda_rank: 0.0

  sigreg_num_slices: 128
  sigreg_num_points: 17
  sigreg_domain: 5.0
