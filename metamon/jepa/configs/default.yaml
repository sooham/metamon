# LeJEPA v2 — model hyperparameters for battle-prefix encoding + action prediction.
#
# Works for both gen1ou and gen9ou: the encoder is sized for Gen 9's longer
# states (~200+ tokens with items, abilities, Tera types, field effects)
# while still being efficient for Gen 1's ~80-token states.
#
# Training hyperparameters (lr, epochs, batch_size, etc.) are passed
# via CLI flags to train.py and are NOT stored here.

model:
  # Vocabulary size (auto-detected from tokenizer if null).
  vocab_size: null

  # Latent space dimensionality (deterministic state embedding e).
  latent_dim: 192

  # Action embedding dimensionality (output of JEPAActionEncoder).
  action_latent_dim: 32

  # ── Block Encoder — bidirectional transformer over one header/state block ──
  encoder:
    d_model: 384
    n_heads: 6
    n_layers: 6
    d_ff: 1536           # 4× d_model
    dropout: 0.1
    max_seq_len: 256
    theta: 10000.0
    ffn_activation: gelu
    gradient_checkpointing: true

  # ── Temporal Encoder — transformer over interleaved block embeddings ──
  temporal_encoder:
    n_heads: 6
    n_layers: 4
    d_ff: 768
    dropout: 0.1
    max_seq_len: 6144
    ffn_activation: gelu
    gradient_checkpointing: true

  # ── Action Encoder — small bidirectional transformer → action embedding ─
  # Shares token embedding with the main encoder.  Encodes action text with
  # structural delimiters (e.g. "<chosen_move>blizzard<end_chosen_move>").
  action_encoder:
    d_model: 128
    n_heads: 4
    n_layers: 3
    d_ff: 512
    dropout: 0.1
    max_seq_len: 64       # actions are very short
    theta: 10000.0
    ffn_activation: gelu
    gradient_checkpointing: false

  # ── Opponent Belief Predictor — shared backbone → state + action heads ──
  # Takes (history_context, current_state) through a shared MLP backbone,
  # then forks into two Gaussian heads:
  #   - state head:  mu/logvar for opponent current-state latent
  #   - action head: mu/logvar for opponent next-action latent
  # Replaces the old separate opponent_state_predictor and paired_action_predictor.
  # Hidden dim is larger than the old individual predictors (768 vs 512) because
  # the backbone serves two heads instead of one.
  opponent_belief_predictor:
    hidden_dim: 768       # 4× latent_dim (wider for shared backbone)
    n_layers: 4

  # ── Paired-POV next-state predictor — stochastic (mu+logvar) ──────
  # Takes (current_state, own_action, predicted_opp_state, predicted_opp_action)
  # through an MLP → mu/logvar for the next-state latent.  Sampled via
  # reparameterization during training; MSE on mu for the loss.
  next_state_predictor:
    hidden_dim: 512       # 2.7× latent_dim
    n_layers: 4

  # ── Pairwise ranking head — RankHead(z_self, z_opp) → scalar advantage ──
  rank_head:
    hidden_dim: 512       # 2.7× latent_dim
    n_layers: 4

  # ── State Predictor — AdaLN-zero conditional transformer ──────────
  # Conditions on encoded player action + predicted opponent action.
  predictor:
    d_model: 256
    n_heads: 8
    n_layers: 6
    d_ff: 1024           # 4× d_model
    dropout: 0.1
    max_seq_len: 64
    gradient_checkpointing: false  # predictor is small

  # ── LeJEPA loss ───────────────────────────────────────────────────
  # SIGReg on state latents (encoder outputs, context, next-state preds).
  # Gaussian prior is reasonable for continuous spatial state embeddings.
  lambda_sigreg_state: 0.1
  # SIGReg on action latents (own, opponent, predicted opponent action).
  # Off by default: action distributions are power-law (common moves +
  # long tail), not Gaussian.  Forcing SIGReg on them can be harmful.
  lambda_sigreg_action: 0.0
  # Deprecated — kept for backward compat.  If lambda_sigreg_state or
  # lambda_sigreg_action are unset, they fall back to this value.
  lambda_sigreg: 0.1
  lambda_rank: 1.0

  # ── SIGReg hyperparameters ────────────────────────────────────────
  sigreg_num_slices: 128
  sigreg_num_points: 17
  sigreg_domain: 3.0
