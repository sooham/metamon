[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metamon"
version = "1.6.0"
description = "Baselines and Datasets for Pokémon Showdown RL"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
  { name = "Jake Grigsby", email = "grigsby@cs.utexas.edu" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Games/Entertainment",
]
keywords = ["pokemon", "reinforcement-learning", "machine-learning"]
dependencies = [
  "gymnasium>=0.26,<=0.29.1",
  "torch>=2.6",
  "numpy",
  "gin-config",
  "wandb",
  "einops",
  "tqdm",
  "lz4",
  "matplotlib",
  "termcolor",
  "rich",
  "huggingface_hub",
  "datasets",
  "ratarmountcore",
  "poke-env @ git+https://github.com/UT-Austin-RPL/poke-env.git",
  "amago @ git+https://github.com/UT-Austin-RPL/amago@v3.4.0",
  "blessed>=1.44",
  "websockets>=12.0",
  "orjson>=3.11.9",
]

[project.urls]
Homepage = "https://metamon.tech"
Repository = "https://github.com/UT-Austin-RPL/metamon"

[tool.setuptools.packages.find]
include = ["metamon*"]

[tool.uv]
# Force torch + CUDA deps from the cu126 index to match the system's CUDA 12.6 driver
# (default PyPI ships cu130 wheels which are incompatible with CUDA 12.6 systems)

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[tool.uv.sources]
torch = { index = "pytorch-cu126", marker = "sys_platform == 'linux'" }


[tool.pytest.ini_options]
addopts = "-n auto --dist worksteal"

[tool.black]
line-length = 88
target-version = ["py310"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-xdist",
]
